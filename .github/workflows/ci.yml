name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The determinism gate (§40): same seed + intents => same StateHash,
      # plus the live-transport lockstep smoke test. If these fail, nothing
      # downstream is safe to ship.
      - run: npm test
